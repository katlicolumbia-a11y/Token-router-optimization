[project]
name = "token-router-optimization"
version = "0.1.0"
description = "Difficulty-aware model router that optimizes model choice for task stages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["openai>=1.0.0"]

[project.optional-dependencies]
pdf = ["pypdf>=4.0.0"]
server = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]

[project.scripts]
token-router = "token_router.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
